[project]
name = "polars-rag-vs-ft"
version = "0.1.0"
description = "A controlled comparison of RAG and QLoRA fine-tuning for Polars code generation."
readme = "README.md"
requires-python = ">=3.10"
# Polars is pinned to one exact version for everything (benchmark, data
# generation, evaluation). See PLAN.md Section 6 / Decisions log.
dependencies = [
    "polars==2.0.0",
]

[project.optional-dependencies]
# Installed only where needed; kept out of the base env so the benchmark
# tooling stays lightweight and reproducible.
rag = [
    "sentence-transformers",
    "lancedb",
]
datagen = [
    "anthropic",
]
# GPU inference / fine-tuning stack for Colab (Phase 2+). torch is deliberately
# NOT pinned here: Colab ships a CUDA-matched torch build and these packages use
# it. The `sys_platform == 'linux'` marker keeps the universal uv lock resolvable
# on non-Linux dev machines (unsloth pulls triton, which has no Windows wheels)
# while still installing on the Linux Colab runtime.
colab = [
    "unsloth==2026.10.3 ; sys_platform == 'linux'",
    # unsloth 2026.10.3 caps transformers at <=5.17.0; 5.17.0 is the newest it
    # allows and already supports Qwen3.5.
    "transformers==5.17.0 ; sys_platform == 'linux'",
    "peft==0.21.2 ; sys_platform == 'linux'",
    "trl==0.29.1 ; sys_platform == 'linux'",
    "accelerate==1.15.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polars_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
